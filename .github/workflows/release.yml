name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches gradle.properties
        run: |
          DECLARED=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          TAGGED="${{ steps.version.outputs.version }}"
          if [ "$DECLARED" != "$TAGGED" ]; then
            echo "::error::Tag is v$TAGGED but gradle.properties says mod_version=$DECLARED. Bump one of them."
            exit 1
          fi
          echo "Version check passed: $DECLARED"

      - name: Generate Gradle wrapper if absent
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.11; fi
          chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Read Minecraft version
        id: mc
        run: |
          MC=$(grep -E '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "mc=$MC" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Rainbow Dye ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          body: |
            Rainbow Dye ${{ steps.version.outputs.version }} for Minecraft ${{ steps.mc.outputs.mc }} (Fabric).

            Requires Fabric API and Java 21.

            Drop the jar in your `mods/` folder. Needs to be on both client and server —
            the server owns the block conversion, the client owns the animated texture.
          files: |
            build/libs/*.jar
            !build/libs/*-dev.jar
